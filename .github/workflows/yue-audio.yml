# 새 학습 자료가 올라오면 광둥어 음성(mp3)을 만들어 audio/ 에 커밋한다.
# 커밋되면 Cloudflare 가 다시 배포하고, 앱이 audio/날짜/yue.json 을 읽어 재생한다.
# 실패해도 앱은 기기 음성으로 대체되므로 학습에는 영향이 없다.
name: yue-audio

on:
  push:
    branches: [main]
    paths:
      - 'data/days/*.json'
      - 'tools/make_audio.py'
      - 'tools/audio-requirements.txt'
      - '.github/workflows/yue-audio.yml'
  workflow_dispatch:
    inputs:
      force:
        description: '이미 있는 음성도 다시 생성'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: yue-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/audio-requirements.txt

      - name: 모델 캐시 (약 730MB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/canto_tts_model
          key: canto-tts-model-fe17418a

      - name: 의존성 설치
        run: pip install -r tools/audio-requirements.txt

      - name: 음성 생성
        env:
          PYTHONUNBUFFERED: '1'
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: |
          set -o pipefail
          python tools/make_audio.py ${{ inputs.force && '--force' || '' }} 2>&1 | tee run.log

      - name: 실패 로그를 저장소에 남김 (원인 확인용, 비밀 값 없음)
        if: failure()
        run: |
          mkdir -p audio/_debug
          { date -u; python --version; tail -n 150 run.log 2>/dev/null; } > audio/_debug/last-failure.log
          git config user.name "haru-audio-bot"
          git config user.email "haru-audio-bot@users.noreply.github.com"
          git add audio/_debug
          git commit -m "audio: 실패 로그" || exit 0
          git pull --rebase origin main && git push origin HEAD:main

      - name: 커밋·푸시
        run: |
          git config user.name "haru-audio-bot"
          git config user.email "haru-audio-bot@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "새 음성 없음"; exit 0; fi
          git commit -m "audio: 광둥어 음성 생성"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

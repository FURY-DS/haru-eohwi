<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>하루어휘 · Morning Words</title>
  <meta name="description" content="매일 아침 광둥어·영어·중국어 단어를 공부하는 나만의 작은 어학실">
  <meta name="theme-color" content="#fffbeb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#19130e" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="하루어휘">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><strong>하루어휘</strong><span>MORNING WORDS</span></div>
      <div class="top-actions">
        <span class="pill">나만의 작은 어학실</span>
        <button class="icon-btn" id="btn-theme" aria-label="화면 모드 전환" title="라이트/다크 전환"></button>
        <button class="icon-btn" id="btn-settings" aria-label="설정" title="설정"></button>
      </div>
    </header>

    <div class="body">
      <nav class="side" aria-label="주 메뉴" id="nav"></nav>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="dlg-cal" aria-label="월간 달력"></dialog>
  <dialog id="dlg-settings" aria-label="설정"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
